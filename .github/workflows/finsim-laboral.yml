name: FIN-SIM - Desafíos laborales
on:
  push:
    paths: ['finanzas/**', '.github/workflows/finsim-laboral.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modelo-financiero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node finanzas/laboral.test.cjs
