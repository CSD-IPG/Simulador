<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTADO FINANCIERO | CSD</title><style>body{font:16px system-ui;margin:0;background:#081426;color:#edf6ff}header{background:#103d6a;color:white;padding:26px}main{max-width:1000px;margin:25px auto;padding:0 16px}section{background:#102940;color:#edf6ff;border:1px solid #40627e;border-radius:12px;padding:22px;margin:15px 0}h1{margin:0}h2{color:#eaf5ff}input,select{padding:11px;width:100%;box-sizing:border-box;border:1px solid #a9bfd5;border-radius:7px}label{display:block;margin:10px 0}button{padding:12px 18px;background:#125f9b;color:white;border:0;border-radius:8px;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.case{background:#16324d;color:#e9f5ff;border:1px solid #4c7290;border-radius:8px;padding:14px;margin:12px 0}.q{padding:12px;background:#142e48;color:#edf6ff;border:1px solid #50718e;margin:12px 0}.q input{width:auto}.note{background:#183e59;color:#eaf6ff;padding:12px;border-radius:7px}.error{background:#5c2a3b;color:#ffe6e9}.success{background:#164c42;color:#dcfff0}details{margin-top:10px}summary{cursor:pointer;font-weight:600}</style><link rel="stylesheet" href="../csd-impulsa/csd-prime.css?v=20261030-3"><script>document.addEventListener("DOMContentLoaded",()=>document.body.dataset.csdPrime="estado-financiero")</script></head><body><header><h1>ESTADO FINANCIERO</h1><p>Escuela de Gestión, Negocios y Marítima · Centro de Simulación Digital · Reforzamiento académico</p></header><main><section id="gate"><h2>Identificación del participante</h2><p>Identificación declarativa, sin OTP ni contraseña. Solo correos institucionales.</p><div class="grid"><label>Perfil<select id="perfil"><option value="estudiante">Estudiante</option><option value="docente">Docente</option><option value="colaborador">Administrativo / comunidad IPG</option></select></label><label>Nombre completo<input id="nombre"></label><label id="rutwrap">RUT<input id="rut" placeholder="12.345.678-5"></label><label>Correo institucional<input id="email" type="email"></label><label id="careerwrap">Carrera / plan<select id="carrera"><option value="">Cargando catálogo…</option></select></label></div><button id="enter">Ingresar</button><p id="msg" class="note"></p></section><div id="app" class="hidden"><section><h2>Ruta formativa · 3 unidades</h2><p id="who"></p><p id="progress"></p><div id="nav"></div></section><section id="lesson"></section><section id="test"></section><section><button id="export">Guardar evidencia JSON</button><button onclick="window.print()">Guardar PDF</button><button onclick="location.href='../'">Volver al CSD</button><p id="sync"></p></section></div></main><script>const U=[["Ratios financieros","Liquidez, rentabilidad, endeudamiento y eficiencia",[["Liquidez","Activo corriente 120; inventarios 30; pasivo corriente 60 (millones). Calcular razón corriente y prueba ácida.","Razón corriente = 120/60 = 2; prueba ácida = (120−30)/60 = 1,5. Contrastar vencimientos."],["Rentabilidad","Ventas 500; utilidad neta 45; activos promedio 300. Calcular margen y ROA.","Margen = 45/500 = 9%; ROA = 45/300 = 15%. Evaluar tendencias y sector."],["Endeudamiento","Pasivos 210; activos 350; patrimonio 140. Evaluar deuda.","Pasivos/activos = 60%; pasivos/patrimonio = 1,5. Mayor apalancamiento implica riesgo."],["Eficiencia y cobertura","Ventas 600; activos promedio 300; EBIT 90; intereses 30.","Rotación = 600/300 = 2; cobertura de intereses = 90/30 = 3 veces."]],[["Razón corriente con AC 120 y PC 60","2","1","3",0],["Prueba ácida con AC 120, inventario 30, PC 60","1,5","2","0,5",0],["Margen neto con utilidad 45 y ventas 500","9%","15%","45%",0],["Endeudamiento con pasivos 210 y activos 350","60%","40%","150%",0],["Cobertura de intereses con EBIT 90 e intereses 30","3 veces","0,33 veces","30 veces",0],["Una razón corriente de 2 significa","Dos unidades de activo corriente por unidad de pasivo corriente","Ausencia de deuda","Rentabilidad del 200%",0]]],["Estados financieros y aplicación de ratios","Estado de situación, resultados y análisis DuPont",[["Estado de situación","Activos 450 y pasivos 275. Determinar patrimonio.","Patrimonio = 450−275 = 175. Se cumple activo = pasivo + patrimonio."],["Estado de resultados","Ventas 400; costo 240; gastos 100; impuestos 12.","Resultado antes de impuestos = 60; utilidad neta = 48; margen neto = 12%."],["DuPont","Utilidad 60; ventas 600; activos promedio 300; patrimonio promedio 150.","Margen 10%; rotación 2; multiplicador 2; ROE = 10% × 2 × 2 = 40%."],["Comparación interanual","Año A: AC 180, PC 90. Año B: AC 165, PC 110.","Razón corriente pasa de 2 a 1,5. Disminuye holgura contable de liquidez."]],[["El estado de situación informa","Activos, pasivos y patrimonio a una fecha","Solo ventas","Solo gastos",0],["Activos 450 y pasivos 275: patrimonio","175","725","275",0],["Ventas 400 y utilidad 48: margen neto","12%","48%","8%",0],["Ventas 600 y activos promedio 300: rotación","2","0,5","3",0],["DuPont: margen 10%, rotación 2 y multiplicador 2","40%","20%","10%",0],["Caída de razón corriente de 2 a 1,5","Menor cobertura contable del pasivo corriente","Quiebra confirmada","Rentabilidad creciente",0]]],["Diseño de informes de análisis financiero","Metodología, evidencias, hallazgos y recomendaciones",[["Diagnóstico de liquidez","Razón corriente cae de 1,8 a 1,2. Redactar hallazgo.","La cobertura contable de obligaciones corrientes disminuyó. Examinar vencimientos y cobranzas."],["Riesgo de deuda","Endeudamiento aumenta de 45% a 65%. Preparar conclusión.","La financiación con pasivos aumentó 20 puntos porcentuales. Evaluar composición y costo de deuda."],["Rentabilidad","Margen neto pasa de 12% a 7%. Preparar explicación.","Caída de 5 puntos porcentuales; revisar costos, gastos y ventas antes de atribuir causas."],["Informe ejecutivo integrado","Empresa ficticia: liquidez 1,2; deuda 65%; margen 7%. Elaborar síntesis.","Incluir empresa, período, fuentes, metodología, tabla de ratios, interpretación, limitaciones y recomendaciones verificables."]],[["Una conclusión sólida contiene","Dato, período, fuente e interpretación","Solo opinión","Solo una recomendación",0],["Liquidez de 1,8 a 1,2 indica","Menor cobertura corriente","Quiebra automática","Aumento del margen",0],["Deuda de 45% a 65% aumenta","20 puntos porcentuales","20 pesos","65 puntos",0],["Margen de 12% a 7% cae","5 puntos porcentuales","5 veces","19 puntos",0],["La metodología debe señalar","Fuentes y fórmulas","Solo nombres","Publicidad",0],["Recomendación responsable","Analizar vencimientos y flujos","Afirmar insolvencia sin datos","Ignorar contexto",0]]]],BASE='https://uegxxazgqvjjqnmpodln.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlZ3h4YXpncXZqanFubXBvZGxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2OTMxMDksImV4cCI6MjEwNjI2OTEwOX0.93hHsgPuCrPWZma29meYK2w5EDBff4tv80aUky4v_UQ',NAME='ESTADO FINANCIERO',STORE='csd_estado_financiero_v1';const $=x=>document.getElementById(x);let user=null,session='',unit=0,progress={passed:[false,false,false],attempts:[0,0,0],scores:[0,0,0]};const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rutOk(v){let x=v.replace(/[.\s-]/g,'').toUpperCase();if(!/^\d{7,8}[\dK]$/.test(x))return false;let sum=0,f=2;for(let i=x.length-2;i>=0;i--){sum+=+x[i]*f;f=f===7?2:f+1}let n=11-sum%11;return(n===11?'0':n===10?'K':String(n))===x.slice(-1)}async function api(path,body){let r=await fetch(BASE+'/rest/v1/'+path,{method:body?'POST':'GET',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Servicio no disponible ('+r.status+')');return r.json()}$('perfil').onchange=()=>{let a=$('perfil').value!=='colaborador';$('rutwrap').hidden=!a;$('careerwrap').hidden=!a};api('catalogo_carreras_csd?select=codigo,nombre&activo=eq.true&order=orden.asc').then(d=>{$('carrera').replaceChildren(new Option('Seleccionar carrera',''),...d.filter(x=>/contad|auditor/i.test(x.nombre)).map(x=>new Option(x.nombre,x.codigo)))}).catch(()=>{$('msg').textContent='No se pudo cargar el catálogo. Actualiza la página.'});$('enter').onclick=async()=>{let perfil=$('perfil').value,nombre=$('nombre').value.trim(),email=$('email').value.trim().toLowerCase(),rut=$('rut').value.trim(),carrera=$('carrera').value;if(nombre.length<3||!/^[^ @]+@(alumnos\.ipg\.cl|docentes\.ipg\.cl|ipg\.cl)$/.test(email)||(perfil!=='colaborador'&&(!rutOk(rut)||!carrera))){$('msg').textContent='Revisa nombre, correo institucional, RUT y carrera. El RUT debe ser válido.';return}let btn=$('enter');btn.disabled=true;session='ef-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);try{let ok=await api('rpc/registrar_identificacion_csd',{p_email:email,p_nombre:nombre,p_rut:perfil==='colaborador'?null:rut,p_carrera_codigo:perfil==='colaborador'?null:carrera,p_perfil:perfil,p_modulo:NAME,p_session_id:session});if(ok!==true)throw Error('Registro rechazado');user={perfil,nombre,email,carrera:perfil==='colaborador'?'Comunidad IPG':$('carrera').selectedOptions[0].textContent};let old=JSON.parse(localStorage.getItem(STORE+email)||'null');if(old&&old.passed?.length===3)progress=old;$('gate').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=nombre+' · '+user.carrera;render()}catch(e){$('msg').textContent='No se pudo registrar el ingreso: '+e.message}finally{btn.disabled=false}};function save(){localStorage.setItem(STORE+user.email,JSON.stringify(progress))}function render(){let d=U[unit];$('progress').textContent=progress.passed.filter(Boolean).length+' de 3 unidades aprobadas';$('nav').innerHTML=U.map((u,i)=>'<button data-unit="'+i+'" '+(i>0&&!progress.passed[i-1]?'disabled':'')+'>'+(progress.passed[i]?'✓ ':'')+'Unidad '+(i+1)+'</button>').join('');document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=+b.dataset.unit;render()});$('lesson').innerHTML='<h2>Unidad '+(unit+1)+': '+esc(d[0])+'</h2><p><b>Contenido:</b> '+esc(d[1])+'</p><h3>Cuatro casos de aplicación</h3>'+d[2].map((c,i)=>'<div class="case"><b>Caso '+(i+1)+': '+esc(c[0])+'</b><p>'+esc(c[1])+'</p><details><summary>Ver resolución explicada</summary><p>'+esc(c[2])+'</p></details></div>').join('');$('test').innerHTML='<h2>Test de salida habilitante · Unidad '+(unit+1)+'</h2><p>6 preguntas · 5 correctas para aprobar · intentos ilimitados. No sustituye las evaluaciones formales de la asignatura.</p><p>Intentos: '+progress.attempts[unit]+' · Mejor resultado: '+progress.scores[unit]+'%</p><form id="quiz">'+d[3].map((q,i)=>'<fieldset class="q"><legend>'+(i+1)+'. '+esc(q[0])+'</legend>'+q.slice(1,4).map((o,j)=>'<label><input type="radio" required name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</fieldset>').join('')+'<button type="submit">Evaluar test</button></form><div id="feedback"></div>';$('quiz').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),hits=d[3].reduce((n,q,i)=>n+(Number(f.get('q'+i))===q[4]?1:0),0),passed=hits>=5,score=Math.round(100*hits/6);progress.attempts[unit]++;progress.scores[unit]=Math.max(progress.scores[unit],score);if(passed)progress.passed[unit]=true;save();const eventId=session+'-u'+(unit+1)+'-i'+progress.attempts[unit];api('rpc/registrar_resultado_csd_v2',{p_event_id:eventId,p_email:user.email,p_modulo:NAME,p_sesion:session,p_evento:passed?'test_aprobado':'test_no_aprobado',p_unidad:unit+1,p_puntaje:score,p_intento:progress.attempts[unit],p_avance:Math.round(progress.passed.filter(Boolean).length/3*100)}).then(()=>{$('sync').textContent='Resultado del test registrado en Supabase.'}).catch(e=>{$('sync').textContent='El avance local se guardó, pero no se sincronizó el resultado. Reintenta cuando tengas conexión.'});$('feedback').innerHTML='<div class="note '+(passed?'success':'error')+'">'+hits+'/6 · '+score+'% · '+(passed?'Aprobado':'Reforzar y reintentar')+'</div>'+(passed&&unit<2?'<button id="next">Continuar a Unidad '+(unit+2)+'</button>':'');if($('next'))$('next').onclick=()=>{unit++;render();window.scrollTo(0,0)};$('progress').textContent=progress.passed.filter(Boolean).length+' de 3 unidades aprobadas';document.querySelectorAll('[data-unit]').forEach(b=>{let i=+b.dataset.unit;b.disabled=i>0&&!progress.passed[i-1]});}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({modulo:NAME,usuario:user,progreso:progress,fecha:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='estado-financiero-evidencia.json';a.click();URL.revokeObjectURL(a.href)};</script><script defer src="../csd-impulsa/identificacion-sesion.js"></script></body></html>
